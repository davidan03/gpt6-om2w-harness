# Local subprocess config.
# A fresh local env_server subprocess is created for each generation and
# killed as a process group on env.exit(), so Chromium children are cleaned up
# even if Playwright/env_server shutdown hangs.
local_process:
  host: "127.0.0.1"
  port_start: 18000
  port_end: 18999
  startup_timeout_secs: 30
  startup_poll_secs: 0.5
  request_timeout_secs: 300
  exit_timeout_secs: 10
  kill_timeout_secs: 5
  max_processes: 16
  acquire_timeout_secs: 600
  log_dir: "/tmp/slime_browser_local_process_env_logs"
  port_lock_dir: "/tmp/slime_browser_local_process_ports"
  python_bin: ""  # empty uses the current Python executable

width: 1280
height: 1000
dpr: 1

max_retries: 3
wait_timeout: 10000
screenshot_timeout: 30000

path_to_tool_list: env/prompts/tool_list.json
path_to_task_file: data/online-mind2web.jsonl
